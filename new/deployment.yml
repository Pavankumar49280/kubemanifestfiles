---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy4
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: magicpin
  template:
    metadata:
      name: mytemplate
      labels:
        app: magicpin
    spec:
      containers:
        - name: cont1
          image: nginx
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "7m"
              memory: "100Mi"
            limits:
              cpu: "10m"
              memory: "200Mi"
